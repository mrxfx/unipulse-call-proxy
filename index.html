<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>UniPulse Call Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f8f7fc;
      color: #17151c;
    }

    .card {
      width: min(90%, 430px);
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e8f8ee;
      color: #16803c;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    code {
      display: block;
      margin-top: 18px;
      padding: 12px;
      background: #f1eff7;
      border-radius: 10px;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="status">● ONLINE</div>

    <h1>UniPulse Call Proxy</h1>

    <p>
      Serverless call notification service is running.
    </p>

    <code>
      /api/notify-call
    </code>
  </div>

</body>
</html>
